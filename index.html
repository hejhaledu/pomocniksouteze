<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05072b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Artimo Manager – Pomocník</title>
<style>
:root{
  --bg:#05072b;
  --glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.08);--glass3:rgba(255,255,255,.13);
  --stroke:rgba(255,255,255,.08);--stroke2:rgba(255,255,255,.14);
  --text:#f4f5fb;--text2:rgba(232,235,255,.62);--text3:rgba(232,235,255,.38);
  --accent:#f5d3a8;--ink:#05072b;--blue:#5b8cff;--green:#34c759;--red:#ff5a5f;--orange:#ff9f0a;--gray:#8e8e93;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
button,input,select,textarea{font-family:inherit;color:inherit}
::selection{background:rgba(91,140,255,.4)}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.hidden{display:none!important}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gray);display:inline-block;flex:0 0 auto}
.dot.ok{background:var(--green)}.dot.wait{background:var(--orange)}.dot.bad{background:var(--red)}.dot.idle{background:#7d82a8}.dot.blue{background:var(--blue)}
.muted{color:var(--text2)}.faint{color:var(--text3)}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.sp{flex:1}
.switch{position:relative;display:inline-block;width:36px;height:22px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:11px;background:rgba(120,120,128,.36);transition:background .2s;cursor:pointer}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+span{background:var(--red)}
.switch input:checked+span::after{transform:translateX(14px)}
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.open{background:rgba(52,199,89,.16);color:#5fe08a}
.badge.locked{background:rgba(255,159,10,.16);color:#ffb84d}
.badge.between{background:rgba(91,140,255,.18);color:#9db8ff}
.badge.done{background:rgba(245,211,168,.18);color:var(--accent)}
.badge.wait,.badge.free{background:rgba(255,255,255,.08);color:var(--text2)}
.badge.urgent{background:var(--red);color:#fff}
.badge.demo{background:var(--blue);color:#fff;letter-spacing:.06em}
.badge.type{background:rgba(255,255,255,.1);color:var(--text)}
.badge.type.health{background:rgba(255,90,95,.18);color:#ff9a9d}
.badge.type.tech{background:rgba(91,140,255,.2);color:#9db8ff}
.badge.type.floor{background:rgba(245,211,168,.18);color:var(--accent)}
.kicker{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:16px;background:var(--glass2);color:var(--text2);font-weight:600;font-size:13px}
.dchip small{font-size:11px;font-weight:600;opacity:.75}
.dchip.done{background:rgba(52,199,89,.14);color:#5fe08a}
.dchip.cur{background:var(--accent);color:var(--ink);box-shadow:0 0 0 1px rgba(245,211,168,.4),0 6px 22px rgba(245,211,168,.18)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ink);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.97)}}
.credit{text-align:center;font-size:11px;color:var(--text3);padding:6px 0 18px;letter-spacing:.02em}
.nchip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:24px;padding:0 7px;border-radius:7px;background:var(--glass2);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.nchip.miss{background:rgba(255,90,95,.16);color:#ff9a9d}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--green);transition:width .3s}

*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);font-size:15px;color:var(--text);background:radial-gradient(900px 500px at 0% -10%,#111766 0%,transparent 60%),var(--bg);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
.hlogo{height:26px;width:auto;flex:0 0 auto;opacity:.95}
.biglogo{height:64px;width:auto;display:block;margin:0 0 16px}
.btn{height:40px;padding:0 16px;border-radius:11px;border:none;background:var(--glass2);font-size:15px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s,opacity .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.blue{background:var(--blue);color:#fff}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.in{height:44px;width:100%;padding:0 12px;border-radius:11px;border:1px solid transparent;background:rgba(255,255,255,.07);font-size:16px;outline:none}
textarea.in{height:auto;padding:10px 12px;line-height:1.4;resize:none}
.in:focus{border-color:var(--blue)}
.in::placeholder{color:var(--text3)}
select.in option{background:#11154a}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(5,7,43,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--stroke)}
.jbadge{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--ink);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.who{flex:1;min-width:0}
.who b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.srow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);line-height:1}
.top{padding:10px 14px 0}
.tabs{display:flex;gap:6px;padding:8px 0 2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;border:none;background:var(--glass);color:var(--text2);font-size:14px;font-weight:600}
.tab.sel{background:var(--accent);color:var(--ink)}
.content{flex:1;overflow-y:auto;padding:8px 14px 14px;-webkit-overflow-scrolling:touch}
.ghead{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.ghead::after{content:"";flex:1;height:1px;background:var(--stroke2)}
.ghead .gc{color:var(--accent)}
footer{display:flex;gap:6px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:rgba(5,7,43,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--stroke)}
.nav{flex:1;height:50px;border:none;border-radius:13px;background:transparent;color:var(--text2);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.nav.sel{background:var(--glass3);color:var(--text)}
.badge-n{background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:1px 7px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:8px;padding:10px 12px;border-radius:14px;border:1px solid var(--stroke);background:var(--glass);box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:15px}
.prow .n{width:50px;height:44px;border-radius:11px;background:var(--glass2);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;flex:0 0 auto;font-variant-numeric:tabular-nums}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm small{display:block;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.prow .ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--stroke2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:transparent}
.prow.in{border-color:rgba(52,199,89,.45);background:rgba(52,199,89,.08)}
.prow.in .n{background:var(--green);color:#04210d}
.prow.in .ck{background:var(--green);border-color:var(--green);color:#04210d}
.sum{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}
.sum b{font-size:26px;font-weight:700;letter-spacing:-.02em}
.sum span{color:var(--text2);font-size:13px}
.ccard{display:block;width:100%;text-align:left;margin-top:10px;padding:14px 16px;border-radius:16px;border:1px solid var(--stroke);background:var(--glass);box-shadow:0 4px 16px rgba(0,0,0,.25);font-size:15px}
.ccard b.t{display:block;font-size:17px;margin:6px 0 4px}
.ccard .m{font-size:13px;color:var(--text2);line-height:1.45}
.ccard.live{border-color:var(--accent);background:rgba(245,211,168,.1);box-shadow:0 0 0 1px rgba(245,211,168,.4),0 8px 30px rgba(245,211,168,.12)}
.ccard.urgent{border-color:rgba(255,90,95,.6);background:rgba(255,90,95,.1)}
.ccard.done{opacity:.55;box-shadow:none}
.ccard p{margin:8px 0 6px;line-height:1.4}
.ccard .acts{display:flex;gap:8px;margin-top:10px}
.ccard .acts .btn{flex:1}
.plrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--stroke)}
.plrow .tm{font-weight:700;width:48px;font-variant-numeric:tabular-nums}
.plrow .tt{flex:1;min-width:0}
.plrow.cur .tt{color:var(--accent);font-weight:700}
.plrow.past{opacity:.5}
.banner{margin:0 0 10px;padding:9px 12px;border-radius:11px;font-size:13px;line-height:1.4;background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.4)}
.banner.demo{background:rgba(91,140,255,.14);border-color:rgba(91,140,255,.4)}
.center{text-align:center;padding:50px 18px;color:var(--text2);line-height:1.55}
.setup{max-width:420px;margin:0 auto;padding:30px 20px;overflow:auto;height:100%}
.setup h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.01em;line-height:1.2}
.setup .sub{color:var(--text2);font-size:14px;min-height:18px}
.setup label{display:block;font-size:13px;color:var(--text2);margin:16px 0 6px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pchip{height:34px;padding:0 12px;border-radius:17px;border:none;background:var(--glass2);color:var(--text2);font-size:14px;font-weight:600}
.pchip.on{background:var(--blue);color:#fff}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgrid button{height:46px;border-radius:12px;border:none;background:var(--glass2);font-size:14px;font-weight:600;color:var(--text2)}
.tgrid button.on{background:var(--blue);color:#fff}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;padding:12px;animation:fade .15s}
.sheet{width:100%;max-width:440px;max-height:92%;overflow:auto;background:#151a52;border:1px solid var(--stroke2);border-radius:20px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.5);margin-bottom:env(safe-area-inset-bottom)}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet p{margin:0 0 10px;color:var(--text2);font-size:14px;line-height:1.45}
.sheet label{display:block;font-size:13px;color:var(--text2);margin:14px 0 6px}
.toasts{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;padding:11px 14px;border-radius:14px;background:#3a1420;border:1px solid rgba(255,90,95,.55);color:#ffd5d6;font-size:14px;line-height:1.4;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.toast.ok{background:#0f2e1c;border-color:rgba(52,199,89,.55);color:#c8f5d6}
.toast b{display:block}
.credit{padding:26px 0 6px}
</style>
</head>

  load() { try { this.docs = JSON.parse(localStorage.getItem(this.key) || "{}"); } catch { this.docs = {}; } },

  const all = starters(), now = parseNow(), q = norm($("pQ").value.trim());
  if (pCat && !catById(pCat)) pCat = "";
  const tabsH = [["all", "Všichni"], ["out", "Chybí"], ["in", "Přítomní"]].map(([k, t]) => `<button class="tab ${pF === k ? "sel" : ""}" data-f="${k}">${t}</button>`).join("") +
    catsSorted().map(c => `<button class="tab ${pCat === c.id ? "sel" : ""}" data-cat="${esc(c.id)}">${esc(c.name)}</button>`).join("");
  if ($("pTabs").dataset.h !== tabsH) { $("pTabs").innerHTML = tabsH; $("pTabs").dataset.h = tabsH; }
  const rows = all.filter(x => (!pCat || x.cats.some(c => c.id === pCat)) && (pF === "all" || (pF === "in") === !!S.prez[x.n]) && matchQ(x, q));
  const present = all.filter(x => S.prez[x.n]).length;
  let nextH = ""; const ni = now ? nextIndex(now) : -1, it = ni >= 0 ? nextCatItem(now, ni) : null, nc = it && catById(it.cid);
  if (nc && !q) { const miss = missingOf(nc); nextH = `<button class="ccard" data-nextcat="${esc(nc.id)}"><span class="kicker">Nejbližší kategorie · ${esc(it.t || "")}</span><b class="t">${esc(nc.name)}</b>
    <span class="m">${miss.length ? `Chybí ${miss.length} z ${nc.couples.length}: <b style="color:#ff9a9d">${miss.join(", ")}</b>` : `<span style="color:#5fe08a">Všichni přítomni (${nc.couples.length})</span>`}</span></button>`; }
  $("content").innerHTML = banners() + `<div class="sum"><b>${present}</b><span>/ ${all.length} přítomno${rows.length !== all.length ? ` · zobrazeno ${rows.length}` : ""}</span></div>` + (pF === "all" && !pCat ? nextH : "") +
    (rows.map(x => `<button class="prow ${S.prez[x.n] ? "in" : ""}" data-n="${x.n}"><span class="n">${x.n}</span><span class="nm"><b>${esc(x.name) || "bez jména"}</b><small>${x.cats.map(c => esc(c.name)).join(" · ")}${S.prez[x.n] ? ` · ${fmtTime(S.prez[x.n].at)} ${esc(S.prez[x.n].by || "")}` : ""}</small></span><span class="ck">✓</span></button>`).join("")
      || `<div class="center">${all.length ? "Nic neodpovídá hledání." : "Startovní listina je zatím prázdná.<br>Vzniká z kategorií ve sčitatelské aplikaci."}</div>`);
}
function taskCard(t) {
  const st = t.status || "new", mine = t.taker === me.name;
  return `<div class="ccard ${t.urgent && st !== "done" ? "urgent" : ""} ${st === "done" ? "done" : ""}"><span class="badge type ${esc(t.type)}">${esc(TASK_TYPES[t.type] || "Jiné")}</span>${t.urgent ? ' <span class="badge urgent">Urgentní</span>' : ""}<span class="faint" style="float:right;font-size:12px">${fmtTime(t.at)}</span>
    <p>${esc(t.text)}</p><span class="m">${t.n ? `Pár <b>${esc(t.n)}</b> ${esc(nameOf(t.n))}<br>` : ""}${esc(t.by || "")}${t.taker ? ` · řeší ${mine ? "<b>vy</b>" : esc(t.taker)}` : " · čeká na převzetí"}${t.doneAt ? ` · hotovo ${fmtTime(t.doneAt)}` : ""}</span>
    ${st === "done" ? "" : `<div class="acts">${mine ? "" : `<button class="btn sm" data-take="${esc(t.id)}">Převzít</button>`}${mine || t.by === me.name ? `<button class="btn sm primary" data-done="${esc(t.id)}">Hotovo</button>` : ""}</div>`}</div>`;
}
function drawTasks() {
  const open = S.tasks.filter(t => t.status !== "done").sort((a, b) => (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0) || (b.at || 0) - (a.at || 0));
  const mine = open.filter(t => t.taker === me.name), rest = open.filter(t => t.taker !== me.name), done = S.tasks.filter(t => t.status === "done").sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 5);
  $("content").innerHTML = banners() + `<button class="btn primary" id="repBtn" style="width:100%;height:56px;font-size:17px;border-radius:15px">Nahlásit problém</button>` +
    (mine.length ? `<div class="ghead">Pro mě <span class="gc">${mine.length}</span></div>${mine.map(taskCard).join("")}` : "") +
    `<div class="ghead">Otevřené <span class="gc">${rest.length}</span></div>${rest.map(taskCard).join("") || `<div class="center" style="padding:18px">Žádná otevřená hlášení.</div>`}` +
    (done.length ? `<div class="ghead">Naposledy vyřešené</div>${done.map(taskCard).join("")}` : "");
}
function drawPlan() {
  const now = parseNow(), run = now?.run, sc = sched(), ni = nextIndex(now);
  const nowH = !now ? `<div class="ccard"><span class="kicker">Právě probíhá</span><p class="m">Průběh kol se tu ukáže, jakmile bude mít vedoucí otevřenou svou aplikaci.</p></div>`
    : run ? `<div class="ccard live"><span class="kicker">Právě probíhá</span><b class="t">${esc(run.cat)} · ${esc(run.label)}</b>${danceChips(run)}
        <div class="m" style="margin-top:8px">${run.cur ? `Tančí se <b style="color:var(--text)">${esc(DANCES[run.cur])}</b>` : run.status === "open" ? "Všechny lístky odevzdané" : "Sčitatel vyhodnocuje"} · ${run.couples.length} párů · stav z ${fmtTime(S.ops.nowAt)}</div></div>`
    : `<div class="ccard"><span class="kicker">Právě probíhá</span><b class="t muted">Teď se netančí</b><span class="m">stav z ${fmtTime(S.ops.nowAt)}</span></div>`;
  $("content").innerHTML = banners() + nowH + `<div class="ghead">Harmonogram</div>` + (sc.map((it, i) => { const s = itemState(it, now), d = delayOf(it, now);
    return `<div class="plrow ${s.code === "open" || s.code === "locked" ? "cur" : s.code === "done" || (ni >= 0 && i < ni && s.code !== "between") ? "past" : ""}"><span class="tm">${esc(it.t || "")}</span><span class="tt">${esc(it.cid ? (catById(it.cid)?.name || "Kategorie") : it.title)}${d ? ` <span class="faint">${delayText(d)}</span>` : ""}</span>${s.code === "free" ? (i === ni ? '<span class="badge between">Následuje</span>' : "") : `<span class="badge ${s.code}">${esc(s.code === "wait" && i === ni ? "Následuje" : s.text)}</span>`}</div>`; }).join("")
    || `<div class="center" style="padding:24px">Vedoucí zatím harmonogram nesestavil.</div>`);
}

// ---------- spodní okna ----------
function sheet(html, onOpen) { $("overlay").innerHTML = `<div class="overlay"><div class="sheet">${html}</div></div>`; const ov = $("overlay").firstChild; ov.onclick = e => { if (e.target === ov) closeSheet(); }; onOpen?.($("overlay")); }
const closeSheet = () => { $("overlay").innerHTML = ""; };
function reportSheet() {
  let type = "health";
  sheet(`<h3>Nahlásit problém</h3><p>Hlášení uvidí vedoucí soutěže a ostatní pomocníci.</p>
    <div class="tgrid" id="rType">${Object.entries(TASK_TYPES).map(([k, v]) => `<button data-k="${k}" class="${k === type ? "on" : ""}">${v}</button>`).join("")}</div>
    <label>Co se děje</label><textarea class="in" id="rText" rows="3" placeholder="Stručně popište, co a kde"></textarea>
    <label>Číslo páru (nepovinné)</label><input class="in" id="rN" inputmode="numeric" pattern="[0-9]*">
    <label class="row" style="margin-top:16px"><span class="switch"><input type="checkbox" id="rUrg"><span></span></span> Urgentní – vedoucí dostane zvukové upozornění</label>
    <div class="row" style="margin-top:18px"><button class="btn" id="rNo" style="flex:1;height:48px">Zrušit</button><button class="btn primary" id="rOk" style="flex:2;height:48px">Odeslat</button></div>`, r => {
    r.querySelectorAll("#rType button").forEach(b => b.onclick = () => { type = b.dataset.k; r.querySelectorAll("#rType button").forEach(x => x.classList.toggle("on", x === b)); r.querySelector("#rUrg").checked = type === "health"; });
    r.querySelector("#rUrg").checked = true;
    r.querySelector("#rNo").onclick = closeSheet;
    r.querySelector("#rOk").onclick = () => {
      const text = r.querySelector("#rText").value.trim(); if (!text) { r.querySelector("#rText").focus(); return toast("Napište, co se děje"); }
      saveTask(newId(), { type, urgent: r.querySelector("#rUrg").checked, text, n: parseInt(r.querySelector("#rN").value, 10) || null, status: "new", by: me.name, byId: deviceId, post: me.post, at: Date.now() });
      closeSheet(); navigator.vibrate?.(30); toast("Odesláno vedoucímu", "", "ok"); beat();
    };
  });
}
function confirmSheet(title, text, ok, fn) {
  sheet(`<h3>${title}</h3><p>${text}</p><div class="row"><button class="btn" id="cNo" style="flex:1;height:46px">Zpět</button><button class="btn primary" id="cOk" style="flex:1;height:46px">${ok}</button></div>`,
    r => { r.querySelector("#cNo").onclick = closeSheet; r.querySelector("#cOk").onclick = () => { closeSheet(); fn(); }; });
}

// ---------- ovládání ----------
$("content").addEventListener("click", e => {
  const row = e.target.closest("[data-n]"), nc = e.target.closest("[data-nextcat]"), tk = e.target.closest("[data-take]"), dn = e.target.closest("[data-done]");
  if (e.target.closest("#repBtn")) return reportSheet();
  if (nc) { pCat = nc.dataset.nextcat; pF = "out"; return draw(); }
  if (row) { const n = +row.dataset.n;
    if (S.prez[n]) return confirmSheet(`Zrušit přítomnost čísla ${n}?`, esc(nameOf(n)) || "", "Zrušit přítomnost", () => { setPresent(n, false, me.name); beat(); });
    setPresent(n, true, me.name); navigator.vibrate?.(20); beat(); return; }
  if (tk) { saveTask(tk.dataset.take, { status: "wip", taker: me.name, takenAt: Date.now() }); return beat(); }
  if (dn) { saveTask(dn.dataset.done, { status: "done", doneAt: Date.now(), doneBy: me.name }); return beat(); }
});
$("pTabs").onclick = e => { const b = e.target.closest(".tab"); if (!b) return; if (b.dataset.f) pF = b.dataset.f; else pCat = pCat === b.dataset.cat ? "" : b.dataset.cat; draw(); };
$("pQ").oninput = draw;
document.querySelector("footer").onclick = e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; $("content").scrollTop = 0; draw(); } };
setInterval(() => { if (!document.hidden && Date.now() - lastBeat > 5 * 60000) beat(true); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) beat(); });

// ---------- start ----------
(async function boot() {
  try { await initBackend(); }
  catch (e) { $("bootMsg").innerHTML = `<span style="color:#ff8a8d">Nepodařilo se připojit: ${esc(errText(e))}</span><br><br><button class="btn primary" onclick="location.reload()">Zkusit znovu</button>`; return; }
  $("boot").remove(); $("home").classList.remove("hidden");
  let id = DEMO ? "ukazka" : params.get("c") || store.get("am_comp");
  if (!id) { try { const l = await B.getCol("competitions"); id = (l.filter(c => c.startedAt && !c.finishedAt).sort((a, b) => (a.test ? 1 : 0) - (b.test ? 1 : 0) || b.startedAt - a.startedAt)[0] || l.filter(c => !c.finishedAt)[0])?.id; } catch {} }
  if (!id) { $("homeTitle").textContent = "Žádná soutěž"; $("homeSub").textContent = "Požádejte vedoucího o odkaz nebo QR kód."; return; }
  listen(id); renderHome();
})();
</script>
</body>
